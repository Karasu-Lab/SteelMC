[package]
name = "steel-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build/build.rs"

[dependencies]
steel-math.workspace = true
steel-macros.workspace = true

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
simdnbt.workspace = true
wincode.workspace = true

# Concurrency
parking_lot.workspace = true
rayon.workspace = true

# Data structures
bitflags.workspace = true
phf.workspace = true
rustc-hash.workspace = true
glam.workspace = true

# UUID
uuid.workspace = true

# Logging
tracing.workspace = true


# Cryptography
crc32c = "0.6.8"

# Utilities
enum_dispatch.workspace = true
rand.workspace = true
text_components.workspace = true
toml.workspace = true
unicode_names2.workspace = true

# Select the browser entropy source for every getrandom major in the graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom-03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom-04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["rng-getrandom"] }
# Pure Rust zstd for the wasm32 build, where the C library cannot be built.
ruzstd = "0.8"

[dev-dependencies]
criterion.workspace = true
md5.workspace = true

[build-dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Proc macros
proc-macro2.workspace = true
quote.workspace = true
prettyplease = { workspace = true, optional = true }
syn = { workspace = true, features = ["full"], optional = true }

# Data structures
phf_codegen.workspace = true

# Utilities
chrono.workspace = true
heck.workspace = true
text_components = { workspace = true, features = ["build"] }
reqwest = { workspace = true, features = ["blocking"] }
sha1.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[[bench]]
name = "xoroshiro"
harness = false

[[bench]]
name = "legacy_random"
harness = false

[[bench]]
name = "variable_integer"
harness = false

[lints]
workspace = true

[features]
fmt = ["dep:prettyplease", "dep:syn"]

# OS-backed tokio features and the C zstd library, unavailable on wasm32.
# This also covers upstream's `cfg(not(target_family = "wasm"))` tokio "fs"
# dependency: "fs" is included here and wasm32 is the wasm target built.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "fs", "rt-multi-thread", "io-std", "signal"] }
zstd.workspace = true
